      one logical partition is forbidden.

overlap_policy:
  canonical_role: FULL_HISTORY_CANONICAL
  rule: >-
    A logical daily partition may enter the research input set exactly once.
    Dates covered by both a QA-only source and the canonical corpus resolve
    to the canonical source, and only after cross-request identity of the
    overlapping days has been established at the DECODED-RECORD level (each
    copy independently matches its own vendor manifest; cross-request file
    hashes and sizes differ because of request/container metadata, so
    decoded-record equality is the authoritative identity check). Any date
    covered by TWO research-eligible sources is an error and must fail
    loudly - never silently selected, merged, or row-level deduplicated.
