# MBP-1 source-provenance registry (tracked configuration; part of the
# effective configuration hash). Paths are relative to <data_root>.
#
# Roles:
#   FULL_HISTORY_CANONICAL - the canonical two-year research corpus.
#   MILESTONE0_QA_SAMPLE   - immutable Milestone 0 QA source; reproduces the
#                            original sample audit; NEVER research input.
#
# The two annual jobs are exactly adjacent ([2024-08-17, 2025-08-17) +
# [2025-08-17, 2026-08-17), UTC ns). The two-week sample is fully contained
# in the recent annual job. Its 11 daily files were verified content-identical
# to the annual copies at the DECODED-RECORD level (115,583,040 records
# byte-compared, all identical; artifact mbp1_sample_overlap_record_level).
# File-level vendor SHA-256 differs across requests by design (per-request
# DBN container metadata) and is NOT a valid cross-job identity check.
# The recent annual job is canonical for the overlapping dates.
# Deduplication happens ONLY at this source-job/logical-partition level -
# never by row-level heuristics.
