# Research-eligibility policy (protocol amendment PA-0002).
#
# This file is a RESEARCH-POLICY disposition layer. It does NOT record or
# alter calendar evidence: every date below remains PENDING_EVIDENCE in
# config/data/cme_calendar_evidence.yaml, and the effective calendar stays
# explicitly provisional. Quarantine means "never research input"; it never
# means "verified".
#
# Enforced fail-closed by nqresearch.eligibility (strict schema, extra
# fields forbidden, unique + ascending dates) and bound into partition
# activation by nqresearch.holdout.
meta:
  policy_id: PA-0002-research-quarantine-v1
  policy_version: 1
  amendment: docs/protocol-amendments/PA-0002-research-eligibility-quarantine.md
  # Lifecycle: PROPOSED_PENDING_INDEPENDENT_REVIEW ->
  # IMPLEMENTED_PENDING_ACTIVATION_APPROVAL -> APPROVED_FOR_ACTIVATION.
  # ONLY the approved state can ever satisfy partition activation. Approved
  # by the project owner (Wian) on 2026-08-20 after independent review; see
  # audit-log entry AL-0060.
  #
  # This is POLICY approval only. It is NOT approval of an activation
  # candidate and it does NOT activate partitions: activation additionally
  # requires a generated candidate, a separately recorded human approval of
  # that exact candidate's SHA-256 (PA-0003), and
  # config/data/partitions_active.yaml. The ten dates below remain truthfully
  # PENDING_EVIDENCE and the calendar stays provisional.
  status: APPROVED_FOR_ACTIVATION
  canonical_basis: >-
    canonical §50 allowed exclusion "predefined holiday/partial-session
    rule", with a machine-readable reason code per excluded session; defined
    in advance of any feature, label, model or result, and therefore not one
    of §50's forbidden outcome-driven exclusions.
  evidence_matrix_sha256: f6099bd824691479dc246dfff44cdce239e9244333d21a56457f82ab714c1250
  rationale: >-
    CME confirmed no archive of previous years' holiday calendars exists, so
    these ten exceptional sessions have no independent corroboration of their
    official schedule. Observed vendor data agrees with the baseline calendar
    to within 0.3 s, but that is agreement between our data and our own
    calendar: a baseline error would propagate self-consistently through
    session assignment, RTH windowing, labels and evaluation without
    detection. Excluding the sessions from research costs 8 of 317 observed
    DEV sessions (2.5%) and preserves PA-0001's evidence threshold intact.

# Machine-readable semantics of the mask. Every flag below is asserted by
# tests against the real corpus artifacts; none of them may be weakened
# without a further reviewed amendment.
semantics:
  qa_and_normalization_use: ALLOWED_FOR_QA_AND_SESSION_RECONSTRUCTION
  research_use: FORBIDDEN
  feature_window_crossing: FORBIDDEN
  label_horizon_crossing: FORBIDDEN
  evaluation_window_crossing: FORBIDDEN
  rolling_state_reset_required_at_next_eligible_session: true
  prior_session_state_features_require_policy_review: true
  calendar_membership_unchanged: true
  partition_contiguity_unchanged: true
  coverage_counts_unchanged: true
  causal_roll_series_consumes_eligibility: false
  raw_data_unchanged: true
  n_mbo_blocks_quarantined: 0
  holdout_sealed: true

