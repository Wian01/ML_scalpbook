# CME calendar evidence matrix — date-level evidence states for every
# exceptional session in the canonical corpus (2024-08-19 .. 2026-08-14).
#
# Governed by docs/protocol-amendments/PA-0001-cme-calendar-evidence-policy.md.
# CME GCC officially confirmed (2026-08-19) that no archive of previous
# years' holiday calendars exists; this matrix therefore records, per date,
# either official CME document verification or explicit triangulation over
# the recorded evidence hierarchy. Nothing here silently upgrades a date:
# a date without sufficient independent evidence stays PENDING_EVIDENCE.
#
# Evidence states (see nqresearch.calendar_evidence):
#   DOCUMENT_VERIFIED                        official CME artifact proves the
#                                            applicable date and exact schedule
#   TRIANGULATED_OFFICIAL_ARCHIVE_UNAVAILABLE  official archive-unavailability
#                                            + observed canonical data
#                                            + independent secondary source,
#                                            no material conflict
#   PENDING_EVIDENCE                         insufficient evidence
#   CONFLICT_REQUIRES_REVIEW                 sources materially disagree
#
# Machine-verified invariants (fail-closed in code): the date set below is
# exactly the frozen exceptional-session set; every date-level evidence
# reference binds to a STABLE claim id its source actually declares; every
# cited source declares the cited date in applicable_dates (a 2026 document
# can never support a 2024/2025 date); every evidence file hash matches the
# immutable copy under <data_root>/reference/cme_calendar/; the GCC .eml is
# parsed and its From/Subject/Date/Message-ID/DKIM/Authentication-Results/
# body must match the identities declared below; the coverage artifact's
# SHA-256 must match before observed fields are compared; triangulation
# requires the verified GCC email, observed canonical data, and a
# SECONDARY_STRONG/SECONDARY_PARTIAL source with a DIRECT or
# DOCUMENTED_INFERENCE claim — lower-tier sources (CrossTrade) and date-only
# sources (Kibot) never suffice.

meta:
  purpose: date-level CME calendar evidence matrix (evidence-policy amendment PA-0001)
  policy_version: 2
  corpus_sessions: {start: "2024-08-19", end: "2026-08-14"}
  evidence_root: reference/cme_calendar  # relative to the configured data_root
  timezone_note: >-
    All schedule times are US Central Time (CT) as published by CME; observed
    timestamps are UTC nanoseconds from the canonical Databento MBP-1 corpus
    (ts_event), converted using America/Chicago DST rules.
  observed_reference:
    artifact: qa/m0_closeout/mbp1_full_history_coverage.json  # relative to data_root
    # LIVE binding (PA-0002 / AL-0053): a versioned digest of the coverage
    # artifact's SUBSTANCE — every non-envelope field, including the artifact
    # type, all corpus/accounting fields and the complete per-session
    # observations. The eight provenance-envelope fields owned by
    # qa/report.py (generated_at_utc, nqresearch_version, git_sha,
    # generation_git_clean, restamp_note, audit_code_hash, config_hash,
    # data_root) are excluded.
    substance_digest_algorithm: coverage-substance-v1
    substance_sha256: "2ebf83b6e44c42b24836453740702db2eb5012907bba701de46de4168cd88d39"
    # HISTORICAL / AUDIT-ONLY. This whole-file SHA-256 of the original
    # 2026-08-18 coverage artifact is retained for provenance history and
    # takes NO part in live matrix validation. Binding the whole file here
    # was circular (AL-0052): the file's envelope carries the effective
    # config hash, which carries the eligibility policy, which binds this
    # matrix, which bound the file.
    historical_whole_file_sha256_audit_only: "03545b61595bf3375ab6880d4b7ce3e5d88fa61522291911e43dc3f6b9ea6687"
    historical_generated_at_utc: "2026-08-18T15:31:30Z"
    historical_git_sha: 3c7aee5e0f240b69d136ff341b608644dafc7a52
    note: >-
      Observed per-date behaviour below is transcribed from this artifact.
      Validation RECOMPUTES the coverage-substance-v1 digest from the live
      artifact's bytes (never trusting any digest declared inside the
      artifact), compares it with substance_sha256, and only then
      mechanically re-checks every per-date session presence and RTH span
      against the live artifact. Envelope-only regeneration — a new commit,
      config hash or code hash — therefore does NOT invalidate this
      observation evidence, while ANY substantive change to a session, span,
      count, warning, classification or coverage result DOES. The artifact's
      exact whole-file identity is bound separately and independently at
      partition activation (ActivePartitions.coverage_artifact_sha256 and
      the approved partition proposal); the two identities serve different
      purposes and are never compared with each other.

archive_unavailability:
  statement: >-
    CME Global Command Center (GCC) confirmed in writing that CME does not
    maintain an archive of previous years' holiday calendars and referred the
    researcher to the current 2026 holiday page only. This correspondence
    proves ARCHIVE UNAVAILABILITY ONLY; it does not prove any historical
    trading hours.
  email_source: cme-gcc-archive-unavailable-email
  sender: CME Global Command Center <gcc@cmegroup.com>
  sender_mailbox: gcc@cmegroup.com
  sender_domain: cmegroup.com
  subject: "Request for archived CME Globex equity holiday trading schedules 04700128"
  message_date_utc: "2026-08-19T03:02:46Z"
  message_id: "<rsPa-000000000000000000000000000000000000000000000TJZXSL00QwccnMtPTyyw8kOL1dAB5Q@sfdc.net>"
  authentication: >-
    Recipient-recorded Authentication-Results (mx.google.com): DKIM pass
    (header.i=@cmegroup.com, s=CMEGDKIM1), DMARC pass (header.from=
    cmegroup.com, p=REJECT), SPF pass (Salesforce relay). Scope: this is the
    receiving mail system's stored verdict on the immutable message plus the
    presence of CME's DKIM-Signature (d=cmegroup.com) — not a fresh
    cryptographic DKIM verification against live DNS keys.
  body_statement: >-
    Unfortunately we do not have an archive for previous years holidays
    calendar. You may refer to 2026 trading holidays in our CME Holiday HERE.
  referral_url: "https://www.cmegroup.com/trading-hours.html#tradeDate=2026-09-07"

